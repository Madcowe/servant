[package]
name = "servant"
version = "0.1.0"
edition = "2024"
description = "Autonomi-enabled web browser based on Servo"
license = "MPL-2.0"
publish = false

[[bin]]
name = "servant"
path = "src/main.rs"

[lib]
name = "servant"
path = "src/lib.rs"
crate-type = ["cdylib", "rlib"]

[dependencies]
servo = { workspace = true }
servoshell = { path = "../servoshell" }
net = { workspace = true }
net_traits = { workspace = true }
http = { workspace = true }
ant-core = { path = "../../../ant-client/ant-core" }
tokio = { workspace = true, features = ["full"] }
url = { workspace = true }
log = "0.4"
env_logger = "0.11"
hex = "0.4"
lazy_static = "1.4"
self_encryption = "0.35"
bytes = { workspace = true }
mime_guess = "2.0.4"
serde = { workspace = true, features = ["derive"] }
serde_json = { workspace = true }
futures = "0.3"
clap = { version = "4.4", features = ["derive"] }
toml = "0.8"

[target.'cfg(target_os = "android")'.dependencies]
android_logger = "0.15"
jni = "0.21.1"
lzma-sys = { version = "0.1", features = ["static"] }
servoshell = { path = "../servoshell", features = ["tracing-hitrace"] }
